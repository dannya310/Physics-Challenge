<title>Physics Challenge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#0b1220; --surface:#121b2e; --surface-2:#1a2540; --surface-3:#223050;
  --fg:#eef2fb; --muted:#93a0c2; --accent:#22d3c8; --accent-fg:#06282a;
  --border:#253252;
  --easy:#34d399; --easy-fg:#06281c; --medium:#f59e0b; --medium-fg:#2b1700; --hard:#f87171; --hard-fg:#2b0a0a;
  --good:#34d399; --bad:#f87171; --streak:#fbbf24;
  --t-conv:#3b82f6; --t-vec:#a855f7; --t-vel:#22c55e; --t-acc:#f59e0b; --t-fall:#f43f5e;
  color-scheme: dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f4f6fb; --surface:#ffffff; --surface-2:#eef1f8; --surface-3:#e3e8f4;
    --fg:#121a2e; --muted:#5b6682; --accent:#0f9c91; --accent-fg:#ffffff;
    --border:#d8deed;
    --easy:#0f9c6e; --easy-fg:#ffffff; --medium:#b4790a; --medium-fg:#ffffff; --hard:#d1483f; --hard-fg:#ffffff;
    --good:#0f9c6e; --bad:#d1483f; --streak:#b4790a;
    color-scheme: light;
  }
}
:root[data-theme="light"]{
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#eef1f8; --surface-3:#e3e8f4;
  --fg:#121a2e; --muted:#5b6682; --accent:#0f9c91; --accent-fg:#ffffff;
  --border:#d8deed;
  --easy:#0f9c6e; --easy-fg:#ffffff; --medium:#b4790a; --medium-fg:#ffffff; --hard:#d1483f; --hard-fg:#ffffff;
  --good:#0f9c6e; --bad:#d1483f; --streak:#b4790a;
  color-scheme: light;
}
*{box-sizing:border-box;}
body{background:var(--bg); color:var(--fg); font-family:"Source Sans 3",system-ui,sans-serif; padding-inline:16px;}
h1,h2,h3{font-family:"Big Shoulders Display",system-ui,sans-serif; letter-spacing:.01em; text-wrap:balance; margin:0;}
.mono{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;}
#app{max-width:760px; margin:0 auto; padding-block:24px 48px; min-width:0;}
p{color:var(--muted); line-height:1.55; margin:0;}
.btn{font-family:"Source Sans 3",sans-serif; font-weight:700; font-size:15px; padding:13px 22px; border-radius:11px; border:1px solid var(--border); background:var(--surface-2); color:var(--fg); cursor:pointer; transition:transform .08s ease, border-color .15s ease;}
.btn:hover{border-color:var(--accent);}
.btn:active{transform:scale(.96);}
.btn.primary{background:var(--accent); color:var(--accent-fg); border-color:transparent; font-size:16px;}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.btn-block{width:100%;}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent);}
.card{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:26px 22px;}
@keyframes slideIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
.card.q-card{animation:slideIn .28s ease;}
@keyframes popIn{from{transform:scale(.9); opacity:0;} to{transform:scale(1); opacity:1;}}
/* ---------- start screen ---------- */
.hero{text-align:center; padding-block:28px 8px;}
.hero h1{font-size:clamp(28px,6vw,40px);}
.hero p{max-width:50ch; margin-inline:auto; margin-top:10px;}
.scoring-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-block:18px;}
.scoring-chip{border-radius:12px; padding:14px 10px; text-align:center; border:1px solid var(--border);}
.scoring-chip .lvl{font-family:"IBM Plex Mono",monospace; font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:600;}
.scoring-chip .pts{font-family:"Big Shoulders Display",sans-serif; font-size:26px; font-weight:800; margin-top:2px;}
.scoring-chip.easy{background:color-mix(in srgb, var(--easy) 16%, var(--surface));}
.scoring-chip.medium{background:color-mix(in srgb, var(--medium) 16%, var(--surface));}
.scoring-chip.hard{background:color-mix(in srgb, var(--hard) 16%, var(--surface));}
.bonus-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:4px;}
.bonus-chip{flex:1 1 180px; border-radius:11px; padding:10px 12px; background:var(--surface-2); border:1px solid var(--border); font-size:12.5px; display:flex; align-items:center; gap:8px;}
.bonus-chip .ic{font-size:18px;}
.qtype-legend{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;}
.qtype-pill{font-family:"IBM Plex Mono",monospace; font-size:11px; padding:5px 10px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); color:var(--muted);}
.stat-row{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-block:16px;}
.stat{text-align:center;}
.stat .num{font-family:"Big Shoulders Display",sans-serif; font-size:28px; font-weight:800;}
.stat .lbl{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em;}
/* ---------- quiz screen ---------- */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:12px;}
.progress-wrap{flex:1 1 160px; min-width:0;}
.progress-track{height:8px; border-radius:99px; background:var(--surface-3); overflow:hidden;}
.progress-fill{height:100%; background:var(--accent); border-radius:99px; transition:width .25s ease;}
.progress-label{font-size:12px; color:var(--muted); margin-top:4px; display:flex; gap:10px; align-items:center;}
.streak-tag{font-family:"IBM Plex Mono",monospace; font-weight:700; color:var(--streak); display:inline-flex; align-items:center; gap:3px;}
.score-badge{font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:15px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:7px 12px; white-space:nowrap; transition:transform .15s ease;}
.score-badge.bump{transform:scale(1.12);}
.badge-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
.badge{font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:5px 10px; border-radius:999px; color:#fff;}
.badge.diff-easy{background:var(--easy); color:var(--easy-fg);}
.badge.diff-medium{background:var(--medium); color:var(--medium-fg);}
.badge.diff-hard{background:var(--hard); color:var(--hard-fg);}
.badge.pts{background:var(--surface-3); color:var(--fg); border:1px solid var(--border);}
.q-type{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em;}
.q-text{font-size:21px; font-weight:700; line-height:1.3; margin-block:10px 14px;}
.timer-track{height:4px; border-radius:99px; background:var(--surface-3); overflow:hidden; margin-bottom:16px;}
.timer-fill{height:100%; background:var(--streak); border-radius:99px; width:100%; transform-origin:left; animation:timerShrink linear forwards; animation-duration:8s;}
@keyframes timerShrink{to{width:0%;}}
.options{display:flex; flex-direction:column; gap:10px;}
.opt-btn{display:flex; align-items:center; gap:10px; text-align:left; padding:13px 14px; border-radius:12px; border:1.5px solid var(--border); background:var(--surface-2); color:var(--fg); font-size:15px; cursor:pointer; font-family:inherit; transition:transform .1s ease, border-color .15s ease;}
.opt-btn:hover:not(:disabled){border-color:var(--accent);}
.opt-btn:active:not(:disabled){transform:scale(.98);}
.opt-btn .letter{font-family:"IBM Plex Mono",monospace; font-weight:700; color:var(--muted); flex:none;}
.opt-btn:disabled{cursor:default;}
.opt-btn.correct{border-color:var(--good); background:color-mix(in srgb, var(--good) 20%, var(--surface-2)); animation:popIn .2s ease;}
.opt-btn.wrong{border-color:var(--bad); background:color-mix(in srgb, var(--bad) 20%, var(--surface-2));}
.calc-row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
input[type="number"]{font-family:"IBM Plex Mono",monospace; font-size:17px; padding:12px 14px; border-radius:11px; border:1.5px solid var(--border); background:var(--surface-2); color:var(--fg); width:160px; max-width:100%;}
input[type="number"]:focus{outline:none; border-color:var(--accent);}
.unit-label{color:var(--muted); font-family:"IBM Plex Mono",monospace;}
.feedback{margin-top:16px; border-radius:12px; padding:14px 16px; border:1px solid var(--border); animation:slideIn .2s ease;}
.feedback.ok{border-color:var(--good); background:color-mix(in srgb, var(--good) 14%, var(--surface));}
.feedback.no{border-color:var(--bad); background:color-mix(in srgb, var(--bad) 14%, var(--surface));}
.feedback .verdict{font-weight:700; margin-bottom:6px;}
.feedback .bonus-line{font-size:12.5px; color:var(--streak); font-weight:700; margin-bottom:6px;}
.feedback .detail{font-size:13.5px; color:var(--fg); opacity:.9; line-height:1.5;}
.feedback .detail b{font-family:"IBM Plex Mono",monospace;}
.nav-row{margin-top:18px; display:flex; justify-content:flex-end;}
/* ---------- end screen ---------- */
.score-hero{text-align:center; padding-block:20px 6px;}
.score-hero .big{font-family:"Big Shoulders Display",sans-serif; font-size:56px; font-weight:800; line-height:1;}
.score-hero .of{color:var(--muted); font-size:15px; margin-top:4px;}
.newbest{display:inline-block; margin-top:8px; font-family:"IBM Plex Mono",monospace; font-size:12px; background:var(--accent); color:var(--accent-fg); padding:5px 12px; border-radius:999px;}
.celebrate{margin-top:10px; font-size:13.5px; color:var(--streak); font-weight:700;}
.topic-table{width:100%; border-collapse:collapse; margin-top:10px; font-size:13.5px;}
.topic-table th, .topic-table td{text-align:left; padding:8px 6px; border-bottom:1px solid var(--border);}
.topic-table th{color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.04em;}
.topic-dot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:6px;}
.review-item{border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-top:10px;}
.review-item .q{font-weight:700; font-size:14px; margin-bottom:4px;}
.review-item .meta{font-size:12px; color:var(--muted); margin-bottom:6px;}
.end-actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px;}
.section-title{font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-top:26px; margin-bottom:4px;}
/* ---------- name field + send-to-teacher ---------- */
.name-field{margin-block:16px; text-align:left;}
.name-field label{display:block; margin-bottom:6px;}
input[type="text"]{font-family:"Source Sans 3",sans-serif; font-size:16px; padding:12px 14px; border-radius:11px; border:1.5px solid var(--border); background:var(--surface-2); color:var(--fg); width:100%;}
input[type="text"]:focus{outline:none; border-color:var(--accent);}
.name-error{color:var(--bad); font-size:13px; margin-top:6px;}
.submit-card{margin-top:18px; border-top:1px dashed var(--border); padding-top:18px;}
.submit-card p{font-size:13.5px;}
.result-row{width:100%; font-family:"IBM Plex Mono",monospace; font-size:12.5px; padding:12px 14px; border-radius:11px; border:1.5px solid var(--border); background:var(--surface-2); color:var(--fg); resize:none; margin-top:10px;}
.result-cols{font-size:11.5px; color:var(--muted); margin-top:8px;}
.copy-status{font-size:12.5px; color:var(--good); margin-top:8px; font-weight:600;}
/* ---------- vocab home ---------- */
.vocab-link{display:block; width:100%; text-align:center; margin-top:10px; background:none; border:none; color:var(--accent); font-family:"Source Sans 3",sans-serif; font-weight:700; font-size:14px; cursor:pointer; padding:6px;}
.mode-grid{display:flex; flex-direction:column; gap:12px; margin-top:18px;}
.mode-card{display:flex; align-items:center; gap:14px; text-align:left; border-radius:14px; border:1.5px solid var(--border); background:var(--surface-2); padding:16px; cursor:pointer; font-family:inherit; color:var(--fg); width:100%;}
.mode-card:hover{border-color:var(--accent);}
.mode-card .ic{font-size:28px; flex:none;}
.mode-card .txt{flex:1; min-width:0;}
.mode-card .txt b{display:block; font-size:16px;}
.mode-card .txt span{font-size:13px; color:var(--muted);}
.back-link{background:none; border:none; color:var(--muted); font-family:"IBM Plex Mono",monospace; font-size:12px; text-transform:uppercase; letter-spacing:.06em; cursor:pointer; padding:4px 0; margin-bottom:10px; display:inline-flex; align-items:center; gap:4px;}
.back-link:hover{color:var(--accent);}
/* ---------- word search ---------- */
.ws-wordlist{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0;}
.ws-chip{font-family:"IBM Plex Mono",monospace; font-size:11px; padding:5px 10px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); color:var(--fg);}
.ws-chip.found{background:var(--good); color:#fff; border-color:transparent; text-decoration:line-through; opacity:.75;}
.ws-grid-wrap{max-width:460px; margin:0 auto;}
.ws-grid{display:grid; gap:2px; touch-action:none; user-select:none;}
.ws-cell{aspect-ratio:1; display:flex; align-items:center; justify-content:center; background:var(--surface-2); border:1px solid var(--border); border-radius:4px; font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:11px; color:var(--fg); cursor:pointer;}
.ws-cell.selecting{background:var(--accent); color:var(--accent-fg); border-color:transparent;}
.ws-cell.found{background:var(--good); color:#fff; border-color:transparent;}
/* ---------- crossword ---------- */
.cw-grid-wrap{max-width:420px; margin:0 auto; overflow-x:auto;}
.cw-grid{display:grid; gap:2px; width:max-content; margin:0 auto;}
.cw-cell{width:28px; height:28px; position:relative;}
.cw-cell.blocked{visibility:hidden;}
.cw-cell input{width:100%; height:100%; text-align:center; text-transform:uppercase; font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:14px; padding:0; border-radius:4px; border:1.5px solid var(--border); background:var(--surface-2); color:var(--fg);}
.cw-cell input:focus{outline:none; border-color:var(--accent);}
.cw-cell input.correct{border-color:var(--good); background:color-mix(in srgb, var(--good) 20%, var(--surface-2));}
.cw-cell input.wrong{border-color:var(--bad); background:color-mix(in srgb, var(--bad) 20%, var(--surface-2));}
.cw-num{position:absolute; top:-1px; left:2px; font-size:8px; font-family:"IBM Plex Mono",monospace; color:var(--muted); line-height:1; pointer-events:none;}
.clue-cols{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:18px;}
@media (max-width:480px){.clue-cols{grid-template-columns:1fr;}}
.clue-list{list-style:none; padding:0; margin:8px 0 0;}
.clue-list li{font-size:13px; margin-bottom:8px; line-height:1.4;}
.clue-list b{font-family:"IBM Plex Mono",monospace; color:var(--accent); margin-right:4px;}
/* ---------- type the term ---------- */
.tt-prompt{font-size:16px; line-height:1.45; margin-block:4px 16px;}
/* ---------- inline bonus rounds ---------- */
.bonus-card{border-color:var(--streak);}
.bcw-row{display:flex; gap:6px; flex-wrap:wrap;}
.bcw-row input{width:34px; height:34px; text-align:center; text-transform:uppercase; font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:16px; padding:0; border-radius:6px; border:1.5px solid var(--border); background:var(--surface-2); color:var(--fg);}
.bcw-row input:focus{outline:none; border-color:var(--accent);}
.bcw-row input.correct{border-color:var(--good); background:color-mix(in srgb, var(--good) 20%, var(--surface-2));}
.bcw-row input.wrong{border-color:var(--bad); background:color-mix(in srgb, var(--bad) 20%, var(--surface-2));}
[hidden]{display:none!important;}
</style>
<div id="app"></div>

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function shuffle(arr){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
function fmtNum(x){
  var r = Math.round(x * 100) / 100;
  return (Object.is(r, -0) ? 0 : r).toString();
}
function fmtDateTime(d){
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' +
    pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function startRound(){
  var picked = shuffle(QUESTION_BANK).slice(0, QUIZ_LEN);
  var prepped = picked.map(function(q){
    var item = Object.assign({}, q);
    if (q.type === 'theory' || q.type === 'despeje') {
      var order = shuffle([0,1,2,3]);
      item.shuffledOptions = order.map(function(i){ return q.options[i]; });
      item.shuffledCorrect = order.indexOf(q.correct);
    }
    return item;
  });
  round = {
    questions: prepped,
    idx: 0,
    score: 0,
    displayScore: 0,
    maxScore: prepped.reduce(function(s,q){ return s + q.points; }, 0),
    streak: 0,
    bestStreak: 0,
    log: [],

    qStart: Date.now(),

    sinceBonus: 0,

function currentQ(){ return round.questions[round.idx]; }

function submitTheory(choiceIdx){
  if (round.answeredCurrent) return;
  var q = currentQ();
  var isCorrect = choiceIdx === q.shuffledCorrect;
  finishAnswer(q, isCorrect, q.shuffledOptions[choiceIdx]);
}
function submitCalc(){
  if (round.answeredCurrent) return;
  var q = currentQ();
  var input = document.getElementById('calcInput');
  var val = parseFloat(input.value);
  var isCorrect = !isNaN(val) && Math.abs(val - q.answer) <= q.tol;
  finishAnswer(q, isCorrect, isNaN(val) ? '(no answer)' : fmtNum(val));
}
function finishAnswer(q, isCorrect, given){
  round.answeredCurrent = true;
  var elapsed = Date.now() - round.qStart;
  var streakBonus = 0, speedBonus = 0;
  if (isCorrect) {
    round.streak += 1;
    round.bestStreak = Math.max(round.bestStreak, round.streak);
    if (round.streak >= 3) streakBonus = STREAK_BONUS;
    if (elapsed <= SPEED_WINDOW_MS) speedBonus = SPEED_BONUS;
    round.score += q.points + streakBonus + speedBonus;
  } else {
    round.streak = 0;
  }
  round.log.push({ q: q, isCorrect: isCorrect, given: given, streakBonus: streakBonus, speedBonus: speedBonus, streakAt: round.streak });
  render();
  animateScore();
}
function animateScore(){
  var el = document.querySelector('.score-badge');
  if (!el) return;
  var from = round.displayScore, to = round.score;
  if (from === to) return;
  var start = null, dur = 420;
  function step(ts){
    if (!start) start = ts;
    var p = Math.min(1, (ts - start) / dur);
    var val = Math.round(from + (to - from) * p);
    el.textContent = val + ' pts';
    if (p < 1) { requestAnimationFrame(step); }
    else { round.displayScore = to; el.classList.remove('bump'); }
  }
  el.classList.add('bump');
  requestAnimationFrame(step);
}
function advanceQuestion(){
  if (round.idx < round.questions.length - 1) {
    round.idx++;
    round.answeredCurrent = false;
    round.qStart = Date.now();
    render();
  } else {
    finishRound();
  }
}
function nextQuestion(){
  round.sinceBonus = (round.sinceBonus || 0) + 1;
  var isLast = round.idx >= round.questions.length - 1;
  if (!isLast && round.sinceBonus >= BONUS_INTERVAL) {
    round.sinceBonus = 0;
    round.bonus = makeBonusRound();
    render();
    return;
  }
  advanceQuestion();
}
function bonusContinue(){
  round.bonus = null;
  advanceQuestion();
}
function finishRound(){
  stats.attempts += 1;
  var isBest = round.score > stats.best;
  if (isBest) stats.best = round.score;
  stats.bestStreak = Math.max(stats.bestStreak || 0, round.bestStreak);
  saveStats(stats);
  round.finishedAt = new Date();
  renderEnd(isBest);
}

/* ================= bonus rounds (inline in the 30-question quiz) ================= */
function pickUnused(poolLength, usedArr){
  if (usedArr.length >= poolLength) usedArr.length = 0;
  var idx;
  do { idx = Math.floor(Math.random() * poolLength); } while (usedArr.indexOf(idx) !== -1);
  usedArr.push(idx);
  return idx;
}
function makeBonusRound(){
  var kinds = ['ws', 'cw', 'term'].filter(function(k){ return k !== round.lastBonusKind; });
  var kind = kinds[Math.floor(Math.random() * kinds.length)];
  round.lastBonusKind = kind;
  round.bonusAttempted++;
  if (kind === 'ws') {
    var wsIdx = pickUnused(MINI_WS.length, round.usedMiniWsIdx);
    var data = MINI_WS[wsIdx];
    return { kind: 'ws', data: data, found: {}, foundCells: {}, selecting: false, startCell: null, curCell: null, done: false };
  }
  if (kind === 'cw') {
    var cwIdx = pickUnused(CW_DATA.entries.length, round.usedCwEntries);
    var entry = CW_DATA.entries[cwIdx];
    return { kind: 'cw', entry: entry, answers: entry.word.split('').map(function(){ return ''; }), checked: false, done: false };
  }
  var ttIdx = pickUnused(VOCAB.length, round.usedTermWords);
  var item = VOCAB[ttIdx];
  return { kind: 'term', item: item, answered: false, isCorrect: false, given: '' };
}
function bonusComplete(isCorrect){
  round.bonus.done = true;
  round.bonusCount++;
  if (isCorrect) round.bonusScore += BONUS_POINTS;
  round.score += isCorrect ? BONUS_POINTS : 0;
  render();
  if (isCorrect) animateScore();
}
function bwsCellKey(r, c){ return r + ',' + c; }
function bwsCheckSelection(cells){
  var b = round.bonus;
  var forward = cells.map(function(rc){ return b.data.grid[rc[0]][rc[1]]; }).join('');
  var backward = forward.split('').reverse().join('');
  for (var i = 0; i < b.data.placements.length; i++) {
    var p = b.data.placements[i];
    if (b.found[p.word]) continue;
    if (p.word === forward || p.word === backward) return p;
  }
  return null;
}
function bwsOnDown(r, c){
  var b = round && round.bonus;
  if (!b || b.done) return;
  b.selecting = true;
  b.startCell = [r, c];
  b.curCell = [r, c];
  render();
}
function bwsOnMove(r, c){
  var b = round && round.bonus;
  if (!b || !b.selecting) return;
  if (b.curCell && b.curCell[0] === r && b.curCell[1] === c) return;
  b.curCell = [r, c];
  render();
}
function bwsOnUp(){
  var b = round && round.bonus;
  if (!b || !b.selecting) return;
  b.selecting = false;
  if (b.startCell && b.curCell) {
    var line = wsLineCells(b.startCell[0], b.startCell[1], b.curCell[0], b.curCell[1]);
    if (line) {
      var match = bwsCheckSelection(line);
      if (match) {
        b.found[match.word] = true;
        match.cells.forEach(function(rc){ b.foundCells[bwsCellKey(rc[0], rc[1])] = true; });
      }
    }
  }
  b.startCell = null;
  b.curCell = null;
  var allFound = b.data.placements.every(function(p){ return b.found[p.word]; });
  if (allFound && !b.done) { bonusComplete(true); return; }
  render();
}
window.addEventListener('pointerup', bwsOnUp);

      gridEl.addEventListener('pointermove', function(e){
        if (!b.selecting) return;
        var el = document.elementFromPoint(e.clientX, e.clientY);
        if (el && el.classList && el.classList.contains('ws-cell')) {
          bwsOnMove(parseInt(el.dataset.r, 10), parseInt(el.dataset.c, 10));
        }
      });
    }
  } else if (b.kind === 'cw') {
    var inputs = document.querySelectorAll('.bcw-input');
    inputs.forEach(function(inp){
      inp.addEventListener('input', function(){
        var i = parseInt(inp.dataset.i, 10);
        var v = inp.value.replace(/[^a-zA-Z]/g, '').toUpperCase().slice(-1);
        b.answers[i] = v;
        b.checked = false;
        var focusIdx = v && i < b.entry.word.length - 1 ? i + 1 : i;
        render();
        var el = document.querySelector('.bcw-input[data-i="' + focusIdx + '"]');
        if (el) { el.focus(); el.select(); }
      });
    });
    var checkBtn = document.getElementById('bcwCheck');
    if (checkBtn) checkBtn.onclick = function(){
      b.checked = true;
      var allCorrect = b.entry.word.split('').every(function(ch, i){ return b.answers[i] === ch; });
      if (allCorrect) { bonusComplete(true); } else { render(); }
    };
  } else if (b.kind === 'term') {
    if (!b.answered) {
      var ttInput = document.getElementById('bttInput');
      var ttBtn = document.getElementById('bttCheck');
      function submit(){
        var given = ttInput.value || '';
        var isCorrect = normalizeTerm(given) === normalizeTerm(b.item.word);
        b.answered = true;
        b.isCorrect = isCorrect;
        b.given = given;
        bonusComplete(isCorrect);
      }
      ttBtn.onclick = submit;
      ttInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') submit(); });
      ttInput.focus();
    }
  }
  var skipBtn = document.getElementById('bonusSkipBtn');
  if (skipBtn) skipBtn.onclick = bonusContinue;
  var contBtn = document.getElementById('bonusContinueBtn');
  if (contBtn) contBtn.onclick = bonusContinue;
}

/* ================= word search ================= */
var wsState = null;
function startWordSearch(){
  wsState = {
    found: {},          // word -> true
    foundCells: {},      // "r,c" -> true
    selecting: false,
    startCell: null,
    curCell: null,
    startedAt: Date.now()
  };
  screen = 'wordsearch';
  render();
}
function wsCellKey(r, c){ return r + ',' + c; }
function wsLineCells(r0, c0, r1, c1){
  var dr = r1 - r0, dc = c1 - c0;
  var adr = Math.abs(dr), adc = Math.abs(dc);
  if (!(dr === 0 || dc === 0 || adr === adc)) return null;
  var steps = Math.max(adr, adc);
  var sr = dr === 0 ? 0 : dr / steps;
  var sc = dc === 0 ? 0 : dc / steps;
  var cells = [];
  for (var i = 0; i <= steps; i++) cells.push([r0 + sr * i, c0 + sc * i]);
  return cells;
}
function wsCheckSelection(cells){
  var forward = cells.map(function(rc){ return WS_DATA.grid[rc[0]][rc[1]]; }).join('');
  var backward = forward.split('').reverse().join('');
  for (var i = 0; i < WS_DATA.placements.length; i++) {
    var p = WS_DATA.placements[i];
    if (wsState.found[p.word]) continue;
    if (p.word === forward || p.word === backward) return p;
  }
  return null;
}
function wordSearchHTML(){
  var total = WS_DATA.placements.length;
  var foundCount = Object.keys(wsState.found).length;
  var wordsHtml = WS_DATA.placements.map(function(p){
    var cls = wsState.found[p.word] ? ' found' : '';
    return '<span class="ws-chip' + cls + '">' + esc(p.word) + '</span>';
  }).join('');
  var gridHtml = WS_DATA.grid.map(function(row, r){
    return row.split('').map(function(ch, c){
      var key = wsCellKey(r, c);
      var cls = '';
      if (wsState.foundCells[key]) cls = ' found';
      else if (wsState.selecting && wsState.curCell) {
        var line = wsLineCells(wsState.startCell[0], wsState.startCell[1], wsState.curCell[0], wsState.curCell[1]);
        if (line && line.some(function(rc){ return rc[0] === r && rc[1] === c; })) cls = ' selecting';
      }
      return '<div class="ws-cell' + cls + '" data-r="' + r + '" data-c="' + c + '">' + ch + '</div>';
    }).join('');
  }).join('');
  var done = foundCount === total;
  var doneBanner = done ? '<div class="celebrate" style="text-align:center; margin-top:14px;">✨ All ' + total + ' words found!</div>' : '';
  return '<button class="back-link" id="backToVocab">← Word Games</button>' +
    '<div class="hero" style="padding-block:4px 8px;"><h1 style="font-size:26px;">Word Search</h1>' +
    '<p>Click or drag from the first letter to the last letter of a word.</p></div>' +
    '<div class="progress-track" style="margin-bottom:14px;"><div class="progress-fill" style="width:' + Math.round(foundCount/total*100) + '%"></div></div>' +
    '<div class="ws-wordlist">' + wordsHtml + '</div>' +
    '<div class="ws-grid-wrap"><div class="ws-grid" id="wsGrid" style="grid-template-columns:repeat(' + WS_DATA.size + ',1fr);">' + gridHtml + '</div></div>' +
    doneBanner +
    '<div class="end-actions" style="justify-content:center; margin-top:18px;"><button class="btn" id="wsReset">Clear progress</button></div>';
}
function wsCellFromPoint(x, y){
  var el = document.elementFromPoint(x, y);
  if (!el || !el.classList || !el.classList.contains('ws-cell')) return null;
  return [parseInt(el.dataset.r, 10), parseInt(el.dataset.c, 10)];
}
function wsOnDown(r, c){
  wsState.selecting = true;
  wsState.startCell = [r, c];
  wsState.curCell = [r, c];
  render();
}
function wsOnMove(r, c){
  if (!wsState || !wsState.selecting) return;
  if (wsState.curCell && wsState.curCell[0] === r && wsState.curCell[1] === c) return;
  wsState.curCell = [r, c];
  render();
}
function wsOnUp(){
  if (!wsState || !wsState.selecting) return;
  wsState.selecting = false;
  if (wsState.startCell && wsState.curCell) {
    var line = wsLineCells(wsState.startCell[0], wsState.startCell[1], wsState.curCell[0], wsState.curCell[1]);
    if (line) {
      var match = wsCheckSelection(line);
      if (match) {
        wsState.found[match.word] = true;
        match.cells.forEach(function(rc){ wsState.foundCells[wsCellKey(rc[0], rc[1])] = true; });
      }
    }
  }
  wsState.startCell = null;
  wsState.curCell = null;
  render();
}
// attached once for the life of the page; each handler checks wsState itself,
// so it's a no-op whenever the word-search screen isn't active or no drag is in progress
window.addEventListener('pointerup', wsOnUp);

function wireWordSearch(){
  document.getElementById('backToVocab').onclick = goVocabHome;
  document.getElementById('wsReset').onclick = startWordSearch;
  var gridEl = document.getElementById('wsGrid');
  gridEl.querySelectorAll('.ws-cell').forEach(function(cell){
    cell.addEventListener('pointerdown', function(e){
      e.preventDefault();
      wsOnDown(parseInt(cell.dataset.r, 10), parseInt(cell.dataset.c, 10));
    });
  });
  gridEl.addEventListener('pointermove', function(e){
    if (!wsState.selecting) return;
    var rc = wsCellFromPoint(e.clientX, e.clientY);
    if (rc) wsOnMove(rc[0], rc[1]);
  });
}

/* ================= crossword ================= */
var cwState = null;
function startCrossword(){
  cwState = { answers: {}, checked: false };
  screen = 'crossword';
  render();
}
function cwKey(r, c){ return r + ',' + c; }
function cwFilled(r, c){
  return r >= 0 && r < CW_DATA.height && c >= 0 && c < CW_DATA.width && CW_DATA.grid[r][c] !== null;
}
function crosswordHTML(){
  var numbers = {};
  CW_DATA.entries.forEach(function(e){ numbers[cwKey(e.row, e.col)] = e.number; });
  var cellsHtml = '';
  for (var r = 0; r < CW_DATA.height; r++) {
    for (var c = 0; c < CW_DATA.width; c++) {
      var letter = CW_DATA.grid[r][c];
      if (letter === null) {
        cellsHtml += '<div class="cw-cell blocked"></div>';
        continue;
      }
      var key = cwKey(r, c);
      var val = cwState.answers[key] || '';
      var cls = '';
      if (cwState.checked) cls = (val === letter) ? ' correct' : (val ? ' wrong' : '');
      var num = numbers[key] ? '<span class="cw-num">' + numbers[key] + '</span>' : '';
      cellsHtml += '<div class="cw-cell">' + num +
        '<input maxlength="1" class="cw-input' + cls + '" data-r="' + r + '" data-c="' + c + '" value="' + esc(val) + '"></div>';
    }
  }
  var across = CW_DATA.entries.filter(function(e){ return e.dir === 'across'; });
  var down = CW_DATA.entries.filter(function(e){ return e.dir === 'down'; });
  function clueLi(e){ return '<li><b>' + e.number + '.</b>' + esc(e.clue) + '</li>'; }
  var correctCount = 0, totalCells = 0;
  for (var rr = 0; rr < CW_DATA.height; rr++) for (var cc = 0; cc < CW_DATA.width; cc++) {
    if (CW_DATA.grid[rr][cc] !== null) {
      totalCells++;
      if ((cwState.answers[cwKey(rr, cc)] || '') === CW_DATA.grid[rr][cc]) correctCount++;
    }
  }
  var allCorrect = cwState.checked && correctCount === totalCells;
  var resultLine = cwState.checked
    ? '<div class="celebrate" style="text-align:center; margin-top:10px;">' + (allCorrect ? '✨ Crossword complete!' : correctCount + '/' + totalCells + ' letters correct — keep going.') + '</div>'
    : '';
  return '<button class="back-link" id="backToVocab">← Word Games</button>' +
    '<div class="hero" style="padding-block:4px 8px;"><h1 style="font-size:26px;">Crossword</h1>' +
    '<p>Type one letter per box. Use the clues below.</p></div>' +
    '<div class="cw-grid-wrap"><div class="cw-grid" style="grid-template-columns:repeat(' + CW_DATA.width + ',28px);">' + cellsHtml + '</div></div>' +
    resultLine +
    '<div class="end-actions" style="justify-content:center; margin-top:16px;"><button class="btn primary" id="cwCheck">Check answers</button><button class="btn" id="cwReset">Clear</button></div>' +
    '<div class="clue-cols">' +
      '<div><div class="eyebrow">Across</div><ul class="clue-list">' + across.map(clueLi).join('') + '</ul></div>' +
      '<div><div class="eyebrow">Down</div><ul class="clue-list">' + down.map(clueLi).join('') + '</ul></div>' +
    '</div>';
}
function wireCrossword(){
  document.getElementById('backToVocab').onclick = goVocabHome;
  document.getElementById('cwReset').onclick = startCrossword;
  document.getElementById('cwCheck').onclick = function(){ cwState.checked = true; render(); };
  var inputs = document.querySelectorAll('.cw-input');
  inputs.forEach(function(inp){
    inp.addEventListener('input', function(){
      var r = parseInt(inp.dataset.r, 10), c = parseInt(inp.dataset.c, 10);
      var v = inp.value.replace(/[^a-zA-Z]/g, '').toUpperCase().slice(-1);
      cwState.answers[cwKey(r, c)] = v;
      cwState.checked = false;
      var focusTarget = [r, c];
      if (v) {
        if (cwFilled(r, c + 1)) focusTarget = [r, c + 1];
        else if (cwFilled(r + 1, c)) focusTarget = [r + 1, c];
      }
      render();
      var el = document.querySelector('.cw-input[data-r="' + focusTarget[0] + '"][data-c="' + focusTarget[1] + '"]');
      if (el) { el.focus(); el.select(); }
    });
    inp.addEventListener('keydown', function(e){
      var r = parseInt(inp.dataset.r, 10), c = parseInt(inp.dataset.c, 10);
      if (e.key === 'Backspace' && !inp.value) {
        var prevSel = cwFilled(r, c - 1) ? [r, c-1] : cwFilled(r - 1, c) ? [r-1, c] : null;
        if (prevSel) {
          var prevEl = document.querySelector('.cw-input[data-r="' + prevSel[0] + '"][data-c="' + prevSel[1] + '"]');
          if (prevEl) prevEl.focus();
        }
      }
    });
  });
}

/* ================= type the term ================= */
var ttState = null;
function normalizeTerm(s){
  return String(s).toUpperCase().trim().replace(/\s+/g, '');
}
function startTypeTerm(){
  ttState = { items: shuffle(VOCAB), idx: 0, correct: 0, log: [], answeredCurrent: false };
  screen = 'typeterm';
  render();
}
function typeTermHTML(){
  var item = ttState.items[ttState.idx];
  var pct = Math.round(ttState.idx / ttState.items.length * 100);
  var feedback = '';
  if (ttState.answeredCurrent) {
    var last = ttState.log[ttState.log.length - 1];
    var cls = last.isCorrect ? 'ok' : 'no';
    var verdict = last.isCorrect ? '✓ Correct!' : '✗ Not quite — correct answer: ' + esc(item.word);
    feedback = '<div class="feedback ' + cls + '"><div class="verdict">' + verdict + '</div></div>' +
      '<div class="nav-row"><button class="btn primary" id="ttNextBtn">' +
      (ttState.idx < ttState.items.length - 1 ? 'Next word →' : 'See results →') + '</button></div>';
  }
  return '<button class="back-link" id="backToVocab">← Word Games</button>' +
    '<div class="topbar"><div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
    '<div class="progress-label"><span>Word ' + (ttState.idx + 1) + ' of ' + ttState.items.length + '</span></div></div>' +
    '<div class="score-badge mono">' + ttState.correct + '/' + ttState.items.length + '</div></div>' +
    '<div class="card q-card">' +
      '<div class="badge-row"><span class="badge" style="background:' + (TOPIC_COLOR[item.topic] || 'var(--accent)') + '; color:#fff;">' + esc(item.topic) + '</span></div>' +
      '<div class="q-type">Type the term this describes</div>' +
      '<div class="tt-prompt">' + esc(item.clue) + '</div>' +
      (ttState.answeredCurrent ? '' : '<div class="calc-row"><input type="text" id="ttInput" placeholder="your answer" autocomplete="off" autocapitalize="characters"><button class="btn primary" id="ttCheckBtn">Check</button></div>') +
      feedback +
    '</div>';
}
function wireTypeTerm(){
  document.getElementById('backToVocab').onclick = goVocabHome;
  if (!ttState.answeredCurrent) {
    var inp = document.getElementById('ttInput');
    var btn = document.getElementById('ttCheckBtn');
    function submit(){
      var item = ttState.items[ttState.idx];
      var given = inp.value || '';
      var isCorrect = normalizeTerm(given) === normalizeTerm(item.word);
      if (isCorrect) ttState.correct++;
      ttState.log.push({ item: item, given: given, isCorrect: isCorrect });
      ttState.answeredCurrent = true;
      render();
    }
    btn.onclick = submit;
    inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') submit(); });
    inp.focus();
  } else {
    document.getElementById('ttNextBtn').onclick = function(){
      if (ttState.idx < ttState.items.length - 1) {
        ttState.idx++;
        ttState.answeredCurrent = false;
        render();
      } else {
        screen = 'typetermEnd';
        render();
      }
    };
  }
}
function typeTermEndHTML(){
  var total = ttState.items.length;
  var pct = Math.round(ttState.correct / total * 100);
  var missed = ttState.log.filter(function(e){ return !e.isCorrect; });
  var missedHtml = missed.length === 0
    ? '<p style="margin-top:8px;">Perfect — every term correct.</p>'
    : missed.map(function(e){
        return '<div class="review-item"><div class="q">' + esc(e.item.word) + '</div>' +
          '<div class="meta">' + esc(e.item.clue) + '</div></div>';
      }).join('');
  return '<div class="score-hero"><div class="eyebrow">Word practice complete</div>' +
    '<div class="big mono">' + ttState.correct + '/' + total + '</div>' +
    '<div class="of">' + pct + '% correct</div></div>' +
    '<div class="card"><div class="end-actions"><button class="btn primary" id="ttAgain">Try again</button><button class="btn" id="ttHome">Word Games</button></div></div>' +
    '<div class="section-title">Review (' + missed.length + ' missed)</div>' + missedHtml;
}

render();

})();
</script>
